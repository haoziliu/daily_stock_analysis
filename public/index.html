<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能分析日报</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
            transition: background 0.2s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        [v-cloak] {
            display: none;
        }

        .table-container {
            overflow-x: auto;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1rem;
            line-height: 1.5rem;
            font-weight: 700;
            color: #111827;
        }

        .subsection-title {
            font-size: 0.875rem;
            line-height: 1.25rem;
            font-weight: 700;
            color: #1f2937;
        }

        .field-label {
            font-size: 0.875rem;
            line-height: 1.25rem;
            font-weight: 700;
            color: #374151;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans">
    <div id="app" v-cloak
        class="max-w-md mx-auto md:max-w-5xl h-screen min-h-0 flex flex-col md:flex-row overflow-hidden">

        <div v-if="loading" class="flex-1 flex items-center justify-center h-full">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
        </div>

        <template v-else-if="reports.length > 0 || marketReview">
            <div
                class="bg-white border-b md:border-b-0 md:border-r border-gray-200 md:w-64 flex-shrink-0 shadow-sm z-10 flex flex-col max-h-[34vh] md:max-h-none md:h-full overflow-hidden">

                <div class="p-2 md:p-4 bg-gray-900 text-white flex-shrink-0 flex justify-between items-center md:block">
                    <h1 class="text-sm md:text-lg font-bold">每日智能复盘</h1>
                    <p class="hidden sm:block text-xs text-gray-400 mt-0 md:mt-1">更新于: {{ updateTime }}</p>
                </div>

                <div v-if="marketReview" class="p-2 md:p-3 border-b border-gray-100 bg-blue-50/60 flex-shrink-0">
                    <button @click="selectedIndex = -1"
                        :class="['w-full rounded-lg p-2 md:p-3 text-left border transition-all duration-200', 
                                     selectedIndex === -1 ? 'bg-white border-blue-500 shadow-sm' : 'bg-white/70 border-blue-100 hover:border-blue-300']">
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="text-[11px] md:text-xs font-bold text-blue-600 mb-0.5 md:mb-1">市场复盘</div>
                                <div class="font-bold text-sm text-gray-900">大盘复盘</div>
                                <div class="hidden md:block text-xs text-gray-500 mt-0.5">{{ marketReview.date }}</div>
                            </div>
                            <span class="text-lg md:text-xl font-black ml-3 text-blue-500">🎯</span>
                        </div>
                    </button>
                </div>

                <div v-if="reports.length" class="p-2 md:p-3 border-b border-gray-100 bg-gray-50/80 flex-shrink-0">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-500 tracking-wider">个股列表</span>
                        <span class="text-xs text-gray-400">{{ reports.length }} 只</span>
                    </div>
                </div>

                <div class="flex md:flex-col overflow-x-auto md:overflow-y-auto md:flex-1 min-h-[66px] md:min-h-0">
                    <button v-for="item in visibleReports" :key="item.code"
                        @click="selectedIndex = reports.findIndex(report => report.code === item.code)"
                        :class="['p-2.5 md:p-4 text-left border-b border-gray-100 min-w-[128px] md:min-w-[160px] transition-all duration-200 border-l-4', 
                                     current && current.code === item.code ? 'bg-blue-50/80 border-blue-600' : 'border-transparent hover:bg-gray-50']">
                        <div class="flex justify-between items-center w-full">
                            <div class="min-w-0">
                                <div
                                    class="font-bold text-xs md:text-sm text-gray-900 truncate max-w-[88px] md:max-w-none">
                                    {{ item.name }}</div>
                                <div class="text-xs text-gray-500 mt-0.5">
                                    {{ item.code }}<span class="hidden md:inline"> · {{ getDisplayAdvice(item) }}</span>
                                </div>
                            </div>
                            <span
                                :class="['text-lg md:text-xl font-black ml-2 md:ml-3', getScoreColor(getOverallScore(item))]">
                                {{ getOverallScore(item) }}
                            </span>
                        </div>
                    </button>
                </div>
            </div>

            <div v-if="selectedIndex === -1 && marketReview" class="flex-1 min-h-0 bg-white overflow-y-auto p-4 md:p-8">
                <div class="prose prose-blue max-w-none prose-headings:font-bold prose-a:text-blue-600 prose-img:rounded-xl"
                    v-html="parsedMarkdown"></div>
            </div>

            <div class="flex-1 min-h-0 bg-gray-50 overflow-y-auto relative"
                v-else-if="selectedIndex >= 0 && current && current.dashboard">

                <div
                    class="relative md:sticky md:top-0 flex justify-between items-end p-3 md:px-6 md:py-4 glass-header border-b border-gray-200 shadow-sm z-20">
                    <div>
                        <h2 class="text-lg font-black text-gray-900">{{ current.name }}</h2>
                        <div class="text-sm text-gray-500 mt-1">{{ current.code }} | 分析日期: {{ current.created_at.split(' ')[0] }}</div>
                    </div>

                    <div class="text-right flex-shrink-0">
                        <div
                            :class="['text-2xl font-bold', getChangePct(current) >= 0 ? 'text-green-600' : 'text-red-600']">
                            {{ getPrice(current).toFixed(2) }}
                        </div>
                        <div
                            :class="['text-sm font-bold px-2.5 py-0.5 mt-1 rounded-full inline-block', getChangePct(current) >= 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700']">
                            {{ getChangePct(current) > 0 ? '+' : '' }}{{ getChangePct(current).toFixed(2) }}%
                        </div>
                    </div>
                </div>

                <div class="p-4 md:p-6">
                    <!-- Interactive Glassmorphic Tabs Bar -->
                    <div class="flex border-b border-gray-200 mb-6 bg-white p-1 rounded-xl shadow-sm gap-1">
                        <button @click="activeTab = 'decision'"
                            :class="['flex-1 py-2.5 text-center text-xs sm:text-sm font-bold rounded-lg transition-all duration-200 flex items-center justify-center gap-1.5',
                                     activeTab === 'decision' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50']">
                            <span>🎯</span> 操盘决策
                        </button>
                        <button @click="activeTab = 'data'"
                            :class="['flex-1 py-2.5 text-center text-xs sm:text-sm font-bold rounded-lg transition-all duration-200 flex items-center justify-center gap-1.5',
                                     activeTab === 'data' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50']">
                            <span>📊</span> 技术与数据
                        </button>
                        <button @click="activeTab = 'intelligence'"
                            :class="['flex-1 py-2.5 text-center text-xs sm:text-sm font-bold rounded-lg transition-all duration-200 flex items-center justify-center gap-1.5',
                                     activeTab === 'intelligence' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50']">
                            <span>📰</span> 舆情与基本面
                        </button>
                    </div>

                    <!-- TAB 1: 操盘决策 (按投资者决策心理逻辑重构) -->
                    <div v-show="activeTab === 'decision'" class="space-y-5">
                        
                        <!-- 1. 🎯 核心决策宣告卡片 (包含 AI 综合诊断一段话总结) -->
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 mb-3 border-b border-gray-100">
                                <div class="flex items-center gap-3">
                                    <span :class="['text-base font-black px-3 py-1 rounded-lg text-white shadow-sm', getOverallScore(current) >= 60 ? 'bg-green-600' : (getOverallScore(current) >= 40 ? 'bg-slate-600' : 'bg-red-600')]">
                                        {{ getDisplayAdvice(current) }}
                                    </span>
                                    <div>
                                        <div class="text-sm text-gray-600 font-medium">趋势预测: <span class="font-bold text-gray-900">{{ current?.trend_prediction }}</span></div>
                                        <div class="text-xs text-gray-400 mt-0.5">置信度: {{ current?.confidence_level || '中' }} · 时效: {{ current?.dashboard?.core_conclusion?.time_sensitivity || '今日内' }}</div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4 text-xs md:text-sm bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-100 self-start sm:self-auto">
                                    <div><span class="text-gray-500">综合操盘分: </span><span :class="['font-black text-base', getScoreColor(getOverallScore(current))]">{{ getOverallScore(current) }}</span></div>
                                    <div class="border-l border-gray-200 h-4"></div>
                                    <div><span class="text-gray-500">趋势分: </span><span class="font-bold text-gray-800">{{ getTrendScore(current) }}</span></div>
                                    <div class="border-l border-gray-200 h-4"></div>
                                    <div><span class="text-gray-500">舆情分: </span><span class="font-bold text-gray-800">{{ getSentimentScore(current) }}</span></div>
                                </div>
                            </div>

                            <!-- 一句话核心结论 -->
                            <p class="text-gray-900 font-bold text-base leading-relaxed mb-4 border-l-4 border-blue-500 pl-3">
                                {{ current?.dashboard?.core_conclusion?.one_sentence }}
                            </p>

                            <!-- AI 综合诊断一段话总结 (顶部核心呈现) -->
                            <div class="bg-gray-50/90 rounded-lg p-4 mb-4 border border-gray-100 text-sm">
                                <div class="font-bold text-gray-800 mb-1.5 flex items-center text-sm">
                                    <span class="mr-1.5 text-base">🤖</span> AI 综合诊断总结
                                </div>
                                <p class="text-gray-600 leading-relaxed text-sm">
                                    {{ getPrimarySummary(current) }}
                                </p>
                            </div>

                            <!-- 空仓 vs 持仓者操作指引 -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm bg-blue-50/40 p-4 rounded-lg border border-blue-100">
                                <div class="flex items-start">
                                    <span class="text-lg mr-2 shrink-0">🔭</span>
                                    <div>
                                        <span class="font-bold text-gray-800 block mb-1">空仓者指引</span>
                                        <span class="text-gray-600 leading-snug">{{ current?.dashboard?.core_conclusion?.position_advice?.no_position }}</span>
                                    </div>
                                </div>
                                <div class="flex items-start border-t md:border-t-0 md:border-l border-blue-100/80 pt-2 md:pt-0 md:pl-4">
                                    <span class="text-lg mr-2 shrink-0">💼</span>
                                    <div>
                                        <span class="font-bold text-gray-800 block mb-1">持仓者指引</span>
                                        <span class="text-gray-600 leading-snug">{{ current?.dashboard?.core_conclusion?.position_advice?.has_position }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. 🎯 狙击点位网格 (Sniper Price Levels) -->
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                            <h3 class="card-title border-b border-gray-100 pb-2 mb-4 flex items-center">
                                <span class="mr-2">🎯</span> 关键狙击点位
                            </h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                                <div class="bg-gray-50 p-3 rounded-lg text-center border border-gray-100">
                                    <div class="text-xs text-gray-500 font-medium mb-1">理想买入</div>
                                    <div class="font-black text-gray-900 text-base md:text-lg">{{ current?.dashboard?.battle_plan?.sniper_points?.ideal_buy?.split(' ')[0] || '-' }}</div>
                                </div>
                                <div class="bg-gray-50 p-3 rounded-lg text-center border border-gray-100">
                                    <div class="text-xs text-gray-500 font-medium mb-1">次优买入</div>
                                    <div class="font-black text-gray-900 text-base md:text-lg">{{ current?.dashboard?.battle_plan?.sniper_points?.secondary_buy?.split(' ')[0] || '-' }}</div>
                                </div>
                                <div class="bg-emerald-50 p-3 rounded-lg text-center border border-emerald-100">
                                    <div class="text-xs text-emerald-600 font-medium mb-1">目标止盈</div>
                                    <div class="font-black text-emerald-700 text-base md:text-lg">{{ current?.dashboard?.battle_plan?.sniper_points?.take_profit?.split(' ')[0] || '-' }}</div>
                                </div>
                                <div class="bg-rose-50 p-3 rounded-lg text-center border border-rose-100">
                                    <div class="text-xs text-rose-600 font-medium mb-1">严格止损</div>
                                    <div class="font-black text-rose-700 text-base md:text-lg">{{ current?.dashboard?.battle_plan?.sniper_points?.stop_loss?.split(' ')[0] || '-' }}</div>
                                </div>
                            </div>
                        </div>

                        <!-- 3. ⚖️ 风格仓位规划 (专属卡片：风险风格仅控制仓位与执行) -->
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-gray-100 pb-3 mb-4">
                                <div>
                                    <h3 class="card-title flex items-center">
                                        <span class="mr-2">⚖️</span> 风格仓位规划
                                    </h3>
                                    <p class="text-xs text-gray-400 font-normal mt-0.5">选择您的风险偏好风格，计算匹配仓位与防守线</p>
                                </div>
                                <!-- 风格切换 Pills -->
                                <div class="flex bg-gray-100 p-1 rounded-lg text-xs font-bold gap-1 self-start sm:self-auto">
                                    <button @click="activeRiskStyle = 'balanced'"
                                        :class="['px-3 py-1.5 rounded-md transition-all duration-200', activeRiskStyle === 'balanced' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-900']">
                                        ⚖️ 稳健型 (默认)
                                    </button>
                                    <button @click="activeRiskStyle = 'aggressive'"
                                        :class="['px-3 py-1.5 rounded-md transition-all duration-200', activeRiskStyle === 'aggressive' ? 'bg-white text-amber-600 shadow-sm' : 'text-gray-500 hover:text-gray-900']">
                                        🚀 激进型
                                    </button>
                                    <button @click="activeRiskStyle = 'conservative'"
                                        :class="['px-3 py-1.5 rounded-md transition-all duration-200', activeRiskStyle === 'conservative' ? 'bg-white text-emerald-600 shadow-sm' : 'text-gray-500 hover:text-gray-900']">
                                        🛡️ 保守型
                                    </button>
                                </div>
                            </div>

                            <div class="space-y-3 text-sm">
                                <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 flex items-center justify-between">
                                    <span class="field-label">建议仓位:</span>
                                    <span :class="['font-bold px-3 py-1 rounded text-sm', getStyleBadgeClass(activeRiskStyle)]">
                                        {{ getStyleSuggestedPosition(current) }}
                                    </span>
                                </div>
                                
                                <div class="bg-gray-50 p-3.5 rounded-lg border border-gray-100 text-gray-700 leading-relaxed">
                                    <span class="font-bold text-gray-800 block mb-1">💡 专属操作指引:</span>
                                    {{ getStylePositionAdvice(current) }}
                                </div>

                                <div class="bg-gray-50 p-3.5 rounded-lg border border-gray-100 text-gray-700 leading-relaxed">
                                    <span class="font-bold text-gray-800 block mb-1">🎯 风格止损参考:</span>
                                    <span class="text-red-600 font-semibold">{{ getStyleStopLoss(current) }}</span>
                                </div>

                                <div v-if="getStyleRiskControl(current)" class="bg-rose-50 border border-rose-100 rounded-lg p-3 text-rose-800">
                                    <span class="font-bold block mb-1 text-rose-900">⚠️ 风控纪律:</span>
                                    {{ getStyleRiskControl(current) }}
                                </div>
                            </div>
                        </div>

                        <!-- 4. 🔍 决策依据与检查项 (平铺直展，无展开/收起) -->
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 space-y-4">
                            <h3 class="card-title border-b border-gray-100 pb-2 mb-3 flex items-center justify-between">
                                <span class="flex items-center"><span class="mr-2">🔍</span> 决策依据与检查项</span>
                            </h3>

                            <!-- 信号归因比重条 -->
                            <div v-if="current?.dashboard?.signal_attribution" class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs md:text-sm">
                                <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                                    <div class="flex justify-between text-gray-500 mb-1">
                                        <span>技术面</span><span class="font-bold text-gray-800">{{ current.dashboard.signal_attribution.technical_indicators }}%</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
                                        <div class="bg-blue-500 h-full" :style="{ width: (current.dashboard.signal_attribution.technical_indicators || 0) + '%' }"></div>
                                    </div>
                                </div>
                                <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                                    <div class="flex justify-between text-gray-500 mb-1">
                                        <span>消息面</span><span class="font-bold text-gray-800">{{ current.dashboard.signal_attribution.news_sentiment }}%</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
                                        <div class="bg-amber-500 h-full" :style="{ width: (current.dashboard.signal_attribution.news_sentiment || 0) + '%' }"></div>
                                    </div>
                                </div>
                                <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                                    <div class="flex justify-between text-gray-500 mb-1">
                                        <span>基本面</span><span class="font-bold text-gray-800">{{ current.dashboard.signal_attribution.fundamentals }}%</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
                                        <div class="bg-emerald-500 h-full" :style="{ width: (current.dashboard.signal_attribution.fundamentals || 0) + '%' }"></div>
                                    </div>
                                </div>
                                <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                                    <div class="flex justify-between text-gray-500 mb-1">
                                        <span>大盘环境</span><span class="font-bold text-gray-800">{{ current.dashboard.signal_attribution.market_conditions }}%</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
                                        <div class="bg-purple-500 h-full" :style="{ width: (current.dashboard.signal_attribution.market_conditions || 0) + '%' }"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 交易执行观察清单 -->
                            <div v-if="current?.dashboard?.phase_decision?.watch_conditions?.length > 0">
                                <div class="text-sm font-bold text-gray-800 mb-1.5">📌 交易观察清单</div>
                                <ul class="space-y-1.5 text-xs md:text-sm text-gray-700 bg-blue-50/40 p-3 rounded-lg border border-blue-100">
                                    <li v-for="(cond, idx) in current.dashboard.phase_decision.watch_conditions" :key="idx">• {{ cond }}</li>
                                </ul>
                            </div>

                            <!-- 六维行动检查项 (直接展开) -->
                            <div v-if="current?.dashboard?.battle_plan?.action_checklist?.length > 0" class="pt-3 border-t border-gray-100 text-sm">
                                <div class="font-bold text-gray-800 mb-2">📋 六维行动检查项</div>
                                <ul class="space-y-1.5 text-gray-700 bg-gray-50 p-3 rounded-lg border border-gray-100 text-xs md:text-sm">
                                    <li v-for="(item, idx) in current.dashboard.battle_plan.action_checklist" :key="idx">{{ item }}</li>
                                </ul>
                            </div>

                            <!-- 历史得分走势 (直接展开) -->
                            <div v-show="hasHistory(current)" class="pt-3 border-t border-gray-100 text-sm">
                                <div class="font-bold text-gray-800 mb-2">📈 历史得分走势</div>
                                <div class="relative w-full h-52 md:h-60">
                                    <canvas id="historyChart"></canvas>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- TAB 2: 数据深度透视 -->
                    <div v-show="activeTab === 'data'" class="space-y-6">
                        <!-- 后市展望 -->
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5"
                            v-if="current?.short_term_outlook || current?.medium_term_outlook">
                            <h3 class="card-title border-b border-gray-100 pb-2 mb-3 flex items-center">
                                <span class="mr-2">🔮</span> 后市展望
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                <div v-if="current?.short_term_outlook"
                                    class="bg-blue-50/50 p-3 rounded-lg border border-blue-100">
                                    <h4 class="subsection-title mb-1">短期展望</h4>
                                    <p class="text-blue-800 leading-relaxed">{{ current.short_term_outlook }}</p>
                                </div>
                                <div v-if="current?.medium_term_outlook"
                                    class="bg-purple-50/50 p-3 rounded-lg border border-purple-100">
                                    <h4 class="subsection-title mb-1">中期展望</h4>
                                    <p class="text-purple-800 leading-relaxed">{{ current.medium_term_outlook }}</p>
                                </div>
                            </div>
                        </div>

                        <!-- 支撑位/阻力位 视觉滑块 -->
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5"

                        <!-- 数据指标面板 -->
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">

                            <div class="text-sm text-gray-700 mb-4 bg-gray-50 p-3 rounded-lg">

                                <span class="mx-2 text-gray-300">|</span>
                                <strong>多头排列:</strong> {{ current.dashboard.data_perspective.trend_status.is_bullish ? '✅ 是'
                                : '❌ 否' }}
                                <span class="mx-2 text-gray-300">|</span>
                                <strong>趋势强度:</strong> {{ current.dashboard.data_perspective.trend_status.trend_score }}/100
                            </div>

                            <div class="table-container mb-4 rounded-lg border border-gray-200">
                                <table class="min-w-full text-sm text-left">
                                    <thead class="bg-gray-50 text-gray-600 font-medium border-b border-gray-200">

                                            <th class="py-2 px-3">价格指标</th>

                                    <tbody class="divide-y divide-gray-100 text-gray-800">
                                        <tr>
                                            <td class="py-2 px-3 font-medium">当前价</td>
                                            <td class="py-2 px-3">{{
                                                current.dashboard.data_perspective.price_position.current_price }}</td>
                                        </tr>
                                        <tr>
                                            <td class="py-2 px-3 font-medium">MA5 / 10 / 20</td>
                                            <td class="py-2 px-3">{{ current.dashboard.data_perspective.price_position.ma5
                                                }} / {{ current.dashboard.data_perspective.price_position.ma10 }} / {{
                                                current.dashboard.data_perspective.price_position.ma20 }}</td>

                                        <tr>
                                            <td class="py-2 px-3 font-medium">乖离率(MA5)</td>

                                                {{ current.dashboard.data_perspective.price_position.bias_ma5 }}% ({{
                                                current.dashboard.data_perspective.price_position.bias_status }})

                                            <td class="py-2 px-3 font-medium">支撑位</td>

                                                current.dashboard.data_perspective.price_position.support_level }}</td>

                            <div class="space-y-3 text-sm">

                                        current.dashboard.data_perspective.volume_analysis.volume_ratio }} ({{
                                        current.dashboard.data_perspective.volume_analysis.volume_status }}) | 换手率 {{
                                        current.dashboard.data_perspective.volume_analysis.turnover_rate }}%</span>
                                    <div class="text-gray-500 italic mt-1 flex items-start"><span class="mr-1">💡</span> {{
                                        current.dashboard.data_perspective.volume_analysis.volume_meaning }}</div>
                                </div>
                                <div>
                                    <span class="field-label">筹码:</span>
                                    <span class="text-gray-600">获利比例 {{
                                        current.dashboard.data_perspective.chip_structure.profit_ratio }}% | 平均成本 {{
                                        current.dashboard.data_perspective.chip_structure.avg_cost }} | 集中度 {{
                                        current.dashboard.data_perspective.chip_structure.concentration }}</span>
                                    <div
                                        class="text-gray-600 font-medium mt-1 text-xs px-2 py-1 bg-gray-100 inline-block rounded border border-gray-200">

                    </div>

                    <!-- TAB 3: 情报与催化剂 -->
                    <div v-show="activeTab === 'intelligence'" class="space-y-6">
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                            <h3 class="card-title border-b border-gray-100 pb-2 mb-3 flex items-center">
                                <span class="mr-2">📰</span> 舆情与基本面
                            </h3>
                            <div class="space-y-3 text-sm">
                                <div class="flex items-start">
                                    <span class="field-label w-20 shrink-0">舆情情绪:</span>
                                    <span class="text-gray-600">{{ current.dashboard.intelligence.sentiment_summary
                                        }}</span>
                                </div>
                                <div class="flex items-start">
                                    <span class="field-label w-20 shrink-0">业绩预期:</span>
                                    <span class="text-gray-600">{{ current.dashboard.intelligence.earnings_outlook }}</span>
                                </div>
                                <div class="flex items-start">
                                    <span class="field-label w-20 shrink-0">最新动态:</span>
                                    <span class="text-gray-600">{{ current.dashboard.intelligence.latest_news }}</span>
                                </div>
                                <div class="pt-2"
                                    v-if="current?.dashboard?.intelligence?.positive_catalysts && current.dashboard.intelligence.positive_catalysts.length > 0">
                                    <span class="field-label block mb-1" style="color: #15803d;">✨ 利好催化:</span>
                                    <ul class="list-disc list-inside text-gray-600 pl-1 space-y-1">
                                        <li v-for="(item, idx) in current.dashboard.intelligence.positive_catalysts"
                                            :key="idx">{{ item }}</li>
                                    </ul>
                                </div>
                                <div class="pt-2"
                                    v-if="current?.dashboard?.intelligence?.risk_alerts && current.dashboard.intelligence.risk_alerts.length > 0">
                                    <span class="field-label block mb-1" style="color: #b91c1c;">🚨 风险警报:</span>
                                    <ul class="space-y-1 text-red-700 list-disc list-inside">
                                        <li v-for="(risk, idx) in current.dashboard.intelligence.risk_alerts" :key="idx">{{
                                            risk }}</li>
                                    </ul>
                                </div>

                        </div>
                    </div>
                </div>
        </template>

        <div v-else class="flex-1 flex items-center justify-center min-h-screen text-gray-500">
            暂无分析数据
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, watch, nextTick } = Vue

        createApp({
            setup() {
                const reports = ref([])
                const updateTime = ref('')
                const marketReview = ref(null)
                const selectedIndex = ref(0)
                const loading = ref(true)
                const activeTab = ref('decision')
                const activeRiskStyle = ref('balanced')
                const showDetails = ref(false)
                const historyData = ref({})
                let chartInstance = null

                const getStyleItem = (item) => {
                    const styles = item?.dashboard?.battle_plan?.position_strategy?.styles
                    if (styles && styles[activeRiskStyle.value]) {
                        return styles[activeRiskStyle.value]
                    }
                    return null
                }

                const getStyleSuggestedPosition = (item) => {
                    const styleItem = getStyleItem(item)
                    if (styleItem && styleItem.suggested_position) return styleItem.suggested_position
                    return item?.dashboard?.battle_plan?.position_strategy?.suggested_position || '暂无建议'
                }

                const getStylePositionAdvice = (item) => {
                    const styleItem = getStyleItem(item)
                    if (styleItem && styleItem.position_advice) return styleItem.position_advice
                    return item?.dashboard?.core_conclusion?.position_advice?.no_position || '按策略执行'
                }

                const getStyleStopLoss = (item) => {
                    const styleItem = getStyleItem(item)
                    if (styleItem && styleItem.stop_loss) return styleItem.stop_loss
                    const sniperStop = item?.dashboard?.battle_plan?.sniper_points?.stop_loss
                    return sniperStop ? sniperStop.split(' ')[0] : '跌破止损位/MA20'
                }

                const getStyleRiskControl = (item) => {
                    const styleItem = getStyleItem(item)
                    if (styleItem && styleItem.risk_control) return styleItem.risk_control
                    return item?.dashboard?.battle_plan?.position_strategy?.risk_control || ''
                }

                const getStyleLabel = (styleKey) => {
                    const labels = { balanced: '稳健型', aggressive: '激进型', conservative: '保守型' }
                    return labels[styleKey] || '稳健型'
                }

                const getStyleBadgeClass = (styleKey) => {
                    const classes = {
                        balanced: 'text-blue-600 bg-blue-50',
                        aggressive: 'text-amber-600 bg-amber-50',
                        conservative: 'text-emerald-600 bg-emerald-50'
                    }
                    return classes[styleKey] || 'text-blue-600 bg-blue-50'
                }

                const current = computed(() => {
                    return (selectedIndex.value >= 0 && reports.value.length > 0) ? reports.value[selectedIndex.value] : null
                })

                const hasHistory = (item) => {
                    if (!item) return false
                    return !!(historyData.value[item.code] && historyData.value[item.code].length > 0)
                }

                const updateHistoryChart = () => {
                    if (!current.value) return;
                    const code = current.value.code;
                    const stockHistory = historyData.value[code] || [];
                    if (stockHistory.length === 0) return;
                    
                    const sortedHistory = [...stockHistory].sort((a, b) => a.date.localeCompare(b.date));
                    
                    const dates = sortedHistory.map(h => h.date);
                    const overallScores = sortedHistory.map(h => h.overall_score);
                    const trendScores = sortedHistory.map(h => h.trend_score);
                    const sentimentScores = sortedHistory.map(h => h.sentiment_score);
                    
                    nextTick(() => {
                        const canvas = document.getElementById('historyChart');
                        if (!canvas) return;
                        const ctx = canvas.getContext('2d');
                        
                        if (chartInstance) {
                            chartInstance.data.labels = dates;
                            chartInstance.data.datasets[0].data = overallScores;
                            chartInstance.data.datasets[1].data = trendScores;
                            chartInstance.data.datasets[2].data = sentimentScores;
                            chartInstance.update();
                        } else {
                            chartInstance = new Chart(ctx, {
                                type: 'line',
                                data: {
                                    labels: dates,
                                    datasets: [
                                        {
                                            label: '综合操盘分',
                                            data: overallScores,
                                            borderColor: '#10b981', // green-500
                                            backgroundColor: 'rgba(16, 185, 129, 0.05)',
                                            borderWidth: 3,
                                            tension: 0.3,
                                            fill: true,
                                            pointRadius: 3,
                                            pointHoverRadius: 5
                                        },
                                        {
                                            label: '趋势分',
                                            data: trendScores,
                                            borderColor: '#3b82f6', // blue-500
                                            backgroundColor: 'transparent',
                                            borderWidth: 2,
                                            borderDash: [5, 5],
                                            tension: 0.3,
                                            pointRadius: 2,
                                            pointHoverRadius: 4
                                        },
                                        {
                                            label: '舆情分',
                                            data: sentimentScores,
                                            borderColor: '#f59e0b', // amber-500
                                            backgroundColor: 'transparent',
                                            borderWidth: 2,
                                            borderDash: [2, 2],
                                            tension: 0.3,
                                            pointRadius: 2,
                                            pointHoverRadius: 4
                                        }
                                    ]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    interaction: {
                                        mode: 'index',
                                        intersect: false,
                                    },
                                    plugins: {
                                        legend: {
                                            position: 'top',
                                            labels: {
                                                boxWidth: 12,
                                                font: {
                                                    size: 11,
                                                    weight: 'bold'
                                                }
                                            }
                                        },
                                        tooltip: {
                                            padding: 10,
                                            cornerRadius: 8,
                                            backgroundColor: 'rgba(17, 24, 39, 0.9)',
                                            titleFont: { size: 12, weight: 'bold' },
                                            bodyFont: { size: 12 }
                                        }
                                    },
                                    scales: {
                                        y: {
                                            min: 0,
                                            max: 100,
                                            grid: {
                                                color: 'rgba(241, 245, 249, 1)'
                                            },
                                            ticks: {
                                                font: { size: 10 }
                                            }
                                        },
                                        x: {
                                            grid: {
                                                display: false
                                            },
                                            ticks: {
                                                font: { size: 10 },
                                                maxRotation: 45,
                                                minRotation: 45
                                            }
                                        }
                                    }
                                }
                            });
                        }
                    });
                };

                watch([current, activeTab], () => {
                    if (activeTab.value === 'decision') {
                        setTimeout(updateHistoryChart, 50);
                    }
                });

                const getRangePercent = (item) => {
                    if (!item || !item.dashboard?.data_perspective?.price_position) return 50
                    const pp = item.dashboard.data_perspective.price_position
                    const currentPrice = parseFloat(pp.current_price || getPrice(item))
                    const support = parseFloat(pp.support_level)
                    const resistance = parseFloat(pp.resistance_level)
                    if (isNaN(currentPrice) || isNaN(support) || isNaN(resistance)) return 50
                    if (resistance <= support) return 50
                    const percent = ((currentPrice - support) / (resistance - support)) * 100
                    return Math.min(100, Math.max(0, percent))
                }

                const visibleReports = computed(() => {
                    return [...reports.value].sort((a, b) => getOverallScore(b) - getOverallScore(a))
                })

                const parsedMarkdown = computed(() => {
                    if (marketReview.value && marketReview.value.content) {
                        return marked.parse(marketReview.value.content)
                    }
                    return ''
                })

                // ---- 核心计算逻辑 ----

                // 🎯 升级版：严格遵循“顺势交易”的动态加权计算
                const getOverallScore = (item) => {
                    if (!item) return 0;
                    const trend = getTrendScore(item);
                    const sentiment = item.dashboard?.sentiment_score ?? item.sentiment_score ?? 50;

                    // 1. 空头排列（破位下跌）：趋势一票否决，极度压缩情绪权重，严防抄底
                    if (trend <= 30) {
                        return Math.round(trend * 0.8 + sentiment * 0.2);
                    }
                    // 2. 多头排列（主升浪）：释放情绪弹性，利好起乘数效应，对盘后爆雷保持极高敏感度
                    else if (trend >= 60) {
                        return Math.round(trend * 0.45 + sentiment * 0.55);
                    }
                    // 3. 震荡修复（筑底/横盘）：利用非线性阶跃，盘后强势催化能迅速拉高分值提示突破
                    else {
                        return Math.round(trend * 0.55 + sentiment * 0.45);
                    }
                }

                // 评分颜色：四级阶梯 (根据综合分判断)
                const getScoreColor = (score) => {
                    if (score >= 60) return 'text-green-500';  // 🟢 乐观/多头
                    if (score >= 40) return 'text-slate-400';  // ⚪ 观望/震荡
                    if (score >= 33) return 'text-orange-500'; // 🟠 偏悲观/减仓
                    return 'text-red-600';                     // 🔴 警报/空头
                }

                // 操作建议颜色
                const getAdviceColor = (advice) => {
                    if (!advice) return 'text-gray-900';
                    if (advice.includes('买') || advice.includes('加仓')) return 'text-green-600';
                    if (advice.includes('卖') || advice.includes('清仓')) return 'text-red-600';
                    if (advice.includes('减')) return 'text-orange-500';
                    if (advice.includes('观望') || advice.includes('持有')) return 'text-slate-600';
                    return 'text-gray-900';
                }

                const getDisplayAdvice = (item) => {
                    return item?.dashboard?.operation_advice || item?.operation_advice || '暂无建议'
                }

                const getDecisionLabel = (item) => {
                    const type = item?.dashboard?.decision_type || item?.decision_type || ''
                    const labels = { buy: '买入', hold: '持有/观望', sell: '卖出', reduce: '减仓' }
                    return labels[type] || getDisplayAdvice(item)
                }

                const getTrendScore = (item) => {
                    return Number(item?.dashboard?.data_perspective?.trend_status?.trend_score ?? item?.sentiment_score ?? 0)
                }

                const getSentimentScore = (item) => {
                    return Number(item?.dashboard?.sentiment_score ?? item?.sentiment_score ?? 50)
                }

                const getRiskCount = (item) => {
                    return item?.dashboard?.intelligence?.risk_alerts?.length || 0
                }

                const getPrimarySummary = (item) => {
                    return item?.analysis_summary || '暂无摘要'
                }

                const getPrice = (item) => {
                    if (item.market_snapshot && item.market_snapshot.price !== null && item.market_snapshot.price !== undefined) return parseFloat(item.market_snapshot.price);
                    if (item.current_price !== null && item.current_price !== undefined) return item.current_price;
                    if (item.dashboard?.data_perspective?.price_position?.current_price !== null && item.dashboard?.data_perspective?.price_position?.current_price !== undefined) return parseFloat(item.dashboard.data_perspective.price_position.current_price);
                    return item.realtime_quote?.price || 0;
                }

                const getChangePct = (item) => {
                    if (item.market_snapshot && item.market_snapshot.pct_chg !== null && item.market_snapshot.pct_chg !== undefined) return parseFloat(item.market_snapshot.pct_chg);
                    if (item.change_pct !== null && item.change_pct !== undefined) return item.change_pct;
                    return item.realtime_quote?.change_pct || 0;
                }

                onMounted(async () => {
                    try {
                        // 同时请求日报数据与历史得分走势数据
                        const [repResponse, histResponse] = await Promise.all([
                            fetch('./daily_report.json?t=' + new Date().getTime()),
                            fetch('./score_history.json?t=' + new Date().getTime()).catch(() => null)
                        ])

                        const data = await repResponse.json()
                        let allReports = data.reports || []

                        if (histResponse && histResponse.ok) {
                            try {
                                const histJson = await histResponse.json()
                                historyData.value = histJson.history || {}
                            } catch (e) {
                                console.warn('解析历史得分数据失败:', e)
                            }
                        }

                        // 尝试从报告列表中提取大盘复盘
                        const marketReport = allReports.find(r => r.code === 'MARKET' || r.report_type === 'market_review')
                        if (marketReport) {
                            marketReview.value = {
                                date: marketReport.created_at ? marketReport.created_at.split(' ')[0] : '',
                                content: marketReport.raw_response || marketReport.news_summary || marketReport.analysis_summary
                            }
                            selectedIndex.value = -1
                        } else if (data.market_review) {
                            // 兼容旧格式
                            marketReview.value = data.market_review
                            selectedIndex.value = -1
                        } else {
                            selectedIndex.value = 0
                        }

                        // 过滤掉大盘复盘和没有 dashboard 的无效数据 (防备旧缓存或格式变更)
                        let fetchedReports = allReports.filter(r => r.code !== 'MARKET' && r.report_type !== 'market_review' && r.dashboard)

                        // 🎯 修改排序逻辑：按全新的“综合评分”降序排列
                        fetchedReports.sort((a, b) => getOverallScore(b) - getOverallScore(a))

                        reports.value = fetchedReports
                        updateTime.value = data.update_time || ''

                        // 数据加载完成后，如果是选中了个股，触发图表绘制
                        if (selectedIndex.value >= 0 || fetchedReports.length > 0) {
                            setTimeout(updateHistoryChart, 100);
                        }

                    } catch (error) {
                        console.error('获取数据失败:', error)
                        alert('获取最新报告失败，请检查数据文件。')
                    } finally {
                        loading.value = false
                    }
                })

                return {
                    reports, updateTime, marketReview, selectedIndex, current, loading, parsedMarkdown,
                    visibleReports, activeTab, activeRiskStyle, showDetails, getRangePercent,
                    getScoreColor, getAdviceColor, getOverallScore, getPrice, getChangePct,
                    getDisplayAdvice, getDecisionLabel, getTrendScore, getRiskCount,
                    getPrimarySummary, getSentimentScore, hasHistory,
                    getStyleSuggestedPosition, getStylePositionAdvice, getStyleStopLoss, getStyleRiskControl,
                    getStyleLabel, getStyleBadgeClass
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
